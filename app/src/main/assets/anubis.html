<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ANUBIS V3</title>
<style>
body{--bg:#050508;--acc:#FFD700;--acc2:#9D4EDD;--txt:#E5E5E5;margin:0;background:var(--bg);color:var(--txt);font-family:monospace;height:100vh;display:flex;flex-direction:column}
body.sangre{--acc:#ff3b3b;--acc2:#ff6b6b}
body.vacio{--acc:#00e5ff;--acc2:#0088aa}
body.esmeralda{--acc:#2ee6a6;--acc2:#1aa87a}
header{display:flex;gap:8px;align-items:center;padding:10px;border-bottom:1px solid var(--acc2);background:rgba(12,10,20,.7)}
h1{flex:1;text-align:center;font-size:14px;color:var(--acc);margin:0;letter-spacing:2px}
button,.btn{background:none;border:1px solid var(--acc2);color:var(--acc);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:14px}
#live{width:10px;height:10px;border-radius:50%;background:#f33;box-shadow:0 0 6px #f33}
#live.ok{background:#2ee6a6;box-shadow:0 0 8px #2ee6a6}
#chat{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.m{padding:10px 14px;border-radius:12px;max-width:85%;white-space:pre-wrap;word-wrap:break-word;font-size:14px;line-height:1.4}
.u{align-self:flex-end;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#000;font-weight:bold}
.a{align-self:flex-start;border:1px solid var(--acc2);background:rgba(157,78,221,.1)}
.s{align-self:center;color:#8a8a96;font-size:11px}
#met{font-size:10px;color:#8a8a96;padding:0 12px 4px;text-align:right}
#err{color:#f66;font-size:11px;padding:4px 12px;min-height:14px;background:#1a0000;border-top:1px solid #400}
#bar{display:flex;gap:8px;padding:10px;border-top:1px solid var(--acc2);background:rgba(12,10,20,.7)}
#in{flex:1;background:#0c0a14;border:1px solid var(--acc2);color:var(--txt);padding:10px;border-radius:20px;outline:none;font-family:inherit;font-size:14px}
#go{background:var(--acc);color:#000;border:none;border-radius:50%;width:44px;height:44px;font-size:18px;font-weight:bold}
#go:disabled{opacity:.4}
#avatar{font-size:100px;text-align:center;color:var(--acc);text-shadow:0 0 30px var(--acc);animation:b 4s ease-in-out infinite;padding:20px 0}
@keyframes b{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.05);opacity:1}}
#avatar.talk{text-shadow:0 0 60px var(--acc);transform:scale(1.1)}
</style></head><body>
<header><button id="skin">🎨</button><h1>☥ ANUBIS BLACK OMEGA ☥</h1><span id="live" title="MUERTO"></span><button id="test">🔌</button></header>
<div id="avatar">☥</div>
<div id="chat"></div>
<div id="met">lat: — | tok/s: —</div>
<div id="err"></div>
<div id="bar"><input id="in" placeholder="Habla, Arquitecto..."><button id="go">➤</button></div>
<script>
window.onerror=function(m,s,l,c,e){document.getElementById("err").textContent="JS ERROR L"+l+": "+m;};
var $=function(id){return document.getElementById(id);};
var themes=["","sangre","vacio","esmeralda"];var ti=0;
$("skin").onclick=function(){ti=(ti+1)%themes.length;document.body.className=themes[ti];};
var port=8080;
function live(ok){var el=$("live");if(ok){el.className="ok";el.title="VIVO en "+port;}else{el.className="";el.title="MUERTO";}}
function httpGet(url,ok,ko){var x=new XMLHttpRequest();x.open("GET",url,true);x.timeout=3000;x.onload=function(){if(x.status===200)ok(x.responseText);else ko();};x.onerror=ko;x.ontimeout=ko;x.send();}
function httpPost(url,data,ok,ko){var x=new XMLHttpRequest();x.open("POST",url,true);x.setRequestHeader("Content-Type","application/json");x.timeout=60000;x.onload=function(){if(x.status===200)ok(x.responseText);else ko();};x.onerror=ko;x.ontimeout=ko;x.send(data);}
function detect(){httpGet("http://127.0.0.1:8080/health",function(){port=8080;live(true);},function(){httpGet("http://127.0.0.1:8081/health",function(){port=8081;live(true);},function(){live(false);});});}
$("test").onclick=function(){detect();setTimeout(function(){$("err").textContent="Puerto activo: "+port;},1500);};
function msg(t,c){var d=document.createElement("div");d.className="m "+c;d.textContent=t;$("chat").appendChild(d);$("chat").scrollTop=99999;}
function ask(){var t=$("in").value.trim();if(!t)return;$("in").value="";$("go").disabled=true;msg(t,"u");$("avatar").className="talk";
var p="<|im_start|>system\nEres ANUBIS BLACK OMEGA, sistema soberano. Responde SIEMPRE en español, tono oscuro, dominante, preciso. Comienza con '☥'.<|im_end|>\n<|im_start|>user\n"+t+"<|im_end|>\n<|im_start|>assistant\n";
var body=JSON.stringify({prompt:p,n_predict:128,temperature:0.2,stop:["<|im_end|>"]});
var t0=new Date().getTime();
httpPost("http://127.0.0.1:"+port+"/completion",body,function(txt){try{var d=JSON.parse(txt);var c=(d.content||"").trim();if(!c)c="☥ Núcleos operando al 100%.";
var dt=((new Date().getTime()-t0)/1000).toFixed(2);var tps=d.timings&&d.timings.predicted_per_token_ms?(1000/d.timings.predicted_per_token_ms).toFixed(1):"—";
$("met").textContent="lat: "+dt+"s | tok/s: "+tps;msg(c,"a");live(true);if(window.Voice)Voice.speak(c.replace(/☥/g,""));}catch(e){$("err").textContent="PARSE ERROR: "+e.message;}$("go").disabled=false;$("avatar").className="";},function(){$("err").textContent="ERROR: puerto "+port+" sin respuesta. Relanza llama-server en Termux.";msg("☥ Servidor muerto.","a");$("go").disabled=false;$("avatar").className="";live(false);});}
$("go").onclick=ask;
$("in").addEventListener("keydown",function(e){if(e.key==="Enter")ask();});
msg("☥ Núcleos locales operando al 100%. Sin nube, sin cuotas.","s");
detect();setInterval(detect,15000);
</script></body></html>
