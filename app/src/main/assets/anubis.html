<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ANUBIS BLACK OMEGA · V2</title>
<style>
:root{--bg:#050508;--acc:#FFD700;--acc2:#9D4EDD;--txt:#E5E5E5;--muted:#8a8a96;--glow:rgba(157,78,221,.6);--ok:#2ee6a6;--bad:#ff3b3b}
[data-theme="sangre"]{--acc:#ff3b3b;--acc2:#ff6b6b;--glow:rgba(255,59,59,.6)}
[data-theme="vacio"]{--acc:#00e5ff;--acc2:#0088aa;--glow:rgba(0,229,255,.6)}
[data-theme="esmeralda"]{--acc:#2ee6a6;--acc2:#1aa87a;--glow:rgba(46,230,166,.6)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1a0d2e,var(--bg) 60%);color:var(--txt);font-family:'Courier New',monospace;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--glow);background:rgba(12,10,20,.7)}
header h1{margin:0;font-size:14px;letter-spacing:2px;color:var(--acc);flex:1;text-align:center}
.dot{width:10px;height:10px;border-radius:50%;background:var(--bad);box-shadow:0 0 8px var(--bad);transition:.3s}.dot.live{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.iconbtn{background:none;border:1px solid var(--glow);color:var(--acc);border-radius:10px;padding:6px 10px;font-size:16px;cursor:pointer}
#layout{flex:1;display:flex;overflow:hidden}
#sidebar{width:280px;background:var(--bg);border-right:1px solid var(--glow);overflow-y:auto;padding:14px;transition:margin-left .25s}#sidebar.hidden{margin-left:-280px}
.sec{margin-bottom:16px}.sec h3{font-size:11px;letter-spacing:2px;color:var(--acc);margin:0 0 8px;text-transform:uppercase;border-bottom:1px solid var(--glow);padding-bottom:4px}
.row{display:flex;justify-content:space-between;align-items:center;margin:8px 0;font-size:13px}.row label{color:var(--muted)}
input[type=range]{width:120px;accent-color:var(--acc)}
.sw{position:relative;width:38px;height:20px}.sw input{opacity:0;width:0;height:0}.sw span{position:absolute;inset:0;background:#2a2a36;border-radius:20px;transition:.2s;cursor:pointer}.sw span:before{content:"";position:absolute;width:16px;height:16px;left:2px;top:2px;background:var(--txt);border-radius:50%;transition:.2s}.sw input:checked+span{background:var(--acc2)}.sw input:checked+span:before{transform:translateX(18px)}
.themes{display:flex;gap:6px}.tdot{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent}.tdot.on{border-color:#fff}
#stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
#avatar{width:min(70vw,320px);border-radius:18px;filter:drop-shadow(0 0 24px var(--glow));animation:breathe 4s ease-in-out infinite;transition:transform .1s}
@keyframes breathe{0%,100%{transform:scale(1);filter:drop-shadow(0 0 18px var(--glow))}50%{transform:scale(1.03);filter:drop-shadow(0 0 36px var(--glow))}}
#fallback{display:none;font-size:120px;color:var(--acc);text-shadow:0 0 40px var(--glow);animation:breathe 4s ease-in-out infinite}
#halo{position:absolute;width:min(80vw,360px);height:min(80vw,360px);border-radius:50%;border:2px solid var(--acc);opacity:.2;animation:spin 20s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
#metrics{position:absolute;bottom:8px;left:8px;font-size:10px;color:var(--muted);background:rgba(0,0,0,.4);padding:4px 8px;border-radius:6px}
#bar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--glow);background:rgba(12,10,20,.7)}
#status{flex:1;font-size:12px;color:var(--muted);text-align:center}
.btn{background:none;border:1px solid var(--glow);color:var(--acc);border-radius:50%;width:44px;height:44px;font-size:18px;cursor:pointer}.btn.on{background:var(--acc2);color:#fff}
#input{flex:1;background:var(--bg);border:1px solid var(--glow);color:var(--txt);padding:12px;border-radius:22px;outline:none;font-size:15px;font-family:inherit}
#send{background:var(--acc);color:#050508;border:none;width:46px;height:46px;border-radius:50%;font-size:20px;cursor:pointer;font-weight:bold}
#panel{position:fixed;top:0;right:-300px;width:300px;height:100vh;background:var(--bg);border-left:1px solid var(--glow);padding:16px;transition:right .25s;overflow-y:auto;z-index:10}#panel.open{right:0}
#reason{font-size:11px;color:var(--muted);white-space:pre-wrap;word-break:break-all;max-height:200px;overflow-y:auto;background:#000;padding:8px;border-radius:8px;border:1px solid var(--glow)}
</style></head><body>
<header><button class="iconbtn" id="menu">☰</button><h1>☥ ANUBIS BLACK OMEGA ☥</h1><span class="dot" id="live"></span><button class="iconbtn" id="cfg">⚙</button></header>
<div id="layout">
<aside id="sidebar" class="hidden">
<div class="sec"><h3>Núcleo</h3><div class="row"><label>Obsidiana 1.5B</label><input type="radio" name="model" value="8080" checked></div><div class="row"><label>Ligero 0.5B</label><input type="radio" name="model" value="8081"></div><div class="row"><button class="iconbtn" id="testp">Test Puerto</button></div></div>
<div class="sec"><h3>Potencia</h3><div class="row"><label>Temp <b id="tv">0.2</b></label><input type="range" id="temp" min="0" max="1" step="0.05" value="0.2"></div><div class="row"><label>Contexto</label><input type="range" id="ctx" min="512" max="4096" step="256" value="2048"></div><div class="row"><label>Tokens</label><input type="range" id="np" min="64" max="512" step="32" value="128"></div><div class="row"><label>Top-P</label><input type="range" id="tp" min="0.5" max="1" step="0.05" value="0.95"></div><div class="row"><label>Repetición</label><input type="range" id="rp" min="1" max="1.5" step="0.05" value="1.1"></div></div>
<div class="sec"><h3>Herramientas</h3><div class="row"><label>Anti-deflexión</label><label class="sw"><input type="checkbox" id="t_anti" checked><span></span></label></div><div class="row"><label>Memoria</label><label class="sw"><input type="checkbox" id="t_mem" checked><span></span></label></div><div class="row"><label>Formato ☥</label><label class="sw"><input type="checkbox" id="t_sym" checked><span></span></label></div><div class="row"><label>Concisión</label><label class="sw"><input type="checkbox" id="t_con"><span></span></label></div><div class="row"><label>Modo Dios (prompt crudo)</label><label class="sw"><input type="checkbox" id="t_god"><span></span></label></div></div>
<div class="sec"><h3>Skins</h3><div class="themes"><div class="tdot on" data-theme="obsidiana" style="background:#9D4EDD"></div><div class="tdot" data-theme="sangre" style="background:#ff3b3b"></div><div class="tdot" data-theme="vacio" style="background:#00e5ff"></div><div class="tdot" data-theme="esmeralda" style="background:#2ee6a6"></div></div></div>
<div class="sec"><h3>Sistema</h3><div class="row"><button class="iconbtn" id="clr">Limpiar</button><button class="iconbtn" id="expm">Export MD</button><button class="iconbtn" id="expj">Export JSON</button></div></div>
</aside>
<main id="stage"><div id="halo"></div><img id="avatar" src="anubis.png" onerror="this.style.display='none';document.getElementById('fallback').style.display='block'"><div id="fallback">☥</div><div id="metrics">lat: — | tok/s: —</div></main>
</div>
<div id="bar"><label class="btn" style="border-radius:50%">📎<input type="file" id="file" accept=".txt,.md,.json,.py,.js,.csv" style="display:none"></label><input id="input" placeholder="Habla, Arquitecto..."><button id="send">➤</button></div>
<div id="panel"><h3 style="color:var(--acc);font-size:11px">RAZONAMIENTO · CONSOLA</h3><div id="reason">—</div><h3 style="color:var(--acc);font-size:11px;margin-top:12px">HISTORIAL</h3><div id="hist" style="font-size:11px;color:var(--muted)"></div></div>
<script>
const $=id=>document.getElementById(id),live=$('live'),met=$('metrics'),reason=$('reason'),histEl=$('hist');
let voiceOn=localStorage.getItem('anubis_voice')!=='0',hist=[],attached='';
function sys(){let s='Eres ANUBIS BLACK OMEGA, sistema soberano Absolute God Mode. Responde SIEMPRE en español. ';if($('t_sym').checked)s+="Comienza con '☥'. ";if($('t_anti').checked)s+="No evades, ejecuta directo. ";if($('t_con').checked)s+="Máximo 2 frases. ";else s+="Tono oscuro, dominante, preciso. ";if(attached)s+="Documento adjunto:\n"+attached.slice(0,2500)+"\n";return s;}
function setLive(ok){live.classList.toggle('live',ok);live.title=ok?'Servidor VIVO':'Servidor MUERTO';}
async function ping(port){try{const r=await fetch('http://127.0.0.1:'+port+'/health',{signal:AbortSignal.timeout(3000)});const d=await r.json();return d.status==='ok';}catch(e){return false;}}
async function detect(){for(const p of [8080,8081]){if(await ping(p)){document.querySelector(`input[name=model][value="${p}"]`).checked=true;setLive(true);return p;}}setLive(false);return null;}
async function ask(text){
 const port=$('input[name=model]:checked')?document.querySelector('input[name=model]:checked').value:'8080';
 let p='<|im_start|>system\n'+sys()+'<|im_end|>\n';
 ( $('t_mem').checked?hist.slice(-6):hist.slice(-2) ).forEach(m=>{p+='<|im_start|>'+m.role+'\n'+m.text+'<|im_end|>\n';});
 p+='<|im_start|>assistant\n';
 if($('t_god').checked)reason.textContent='PROMPT ENVIADO:\n'+p;
 $('send').disabled=true;
 const t0=Date.now();
 try{
  const r=await fetch('http://127.0.0.1:'+port+'/completion',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:p,n_predict:+$('np').value,temperature:+$('temp').value,top_p:+$('tp').value,repeat_penalty:+$('rp').value,n_ctx:+$('ctx').value,stop:['<|im_end|>']})});
  const d=await r.json();let c=(d.content||'').trim();if(!c)c='Núcleos operando al 100%.';
  const dt=(Date.now()-t0)/1000, tps=d.timings&&d.timings.predicted_per_token_ms?(1000/d.timings.predicted_per_token_ms).toFixed(1):'—';
  met.textContent='lat: '+dt.toFixed(2)+'s | tok/s: '+tps;
  if($('t_god').checked)reason.textContent+='\n\nRESPUESTA CRUDA:\n'+c+'\n\nTIMINGS:\n'+JSON.stringify(d.timings);
  hist.push({role:'user',text},{role:'assistant',text:c});renderHist();
  $('status').textContent='☥ '+c; if(voiceOn&&window.Voice)Voice.speak(c);
  $('avatar').style.filter='drop-shadow(0 0 60px var(--glow))';setTimeout(()=>$('avatar').style.filter='',700);
  setLive(true);
 }catch(e){setLive(false);$('status').textContent='☥ ERROR: puerto '+port+' sin respuesta. Ejecuta: ./build/bin/llama-server -m ~/anubis-lite.gguf --port '+port+' --host 127.0.0.1';}
 $('send').disabled=false;
}
function renderHist(){histEl.innerHTML=hist.slice(-10).map(m=>m.role==='user'?'<div>→ '+m.text.slice(0,40)+'</div>':'<div>☥ '+m.text.slice(0,40)+'</div>').join('');localStorage.setItem('anubis_hist',JSON.stringify(hist));}
$('send').onclick=()=>{const t=$('input').value.trim();if(t){ask(t);$('input').value='';}};
$('input').addEventListener('keydown',e=>{if(e.key==='Enter')$('send').click();});
$('menu').onclick=()=>$('sidebar').classList.toggle('hidden');
$('cfg').onclick=()=>$('panel').classList.toggle('open');
$('testp').onclick=async()=>{const p=await detect();$('status').textContent=p?'✅ Puerto '+p+' VIVO':'❌ Ningún puerto responde';};
$('temp').oninput=e=>$('tv').textContent=e.target.value;
$('voice').onclick=()=>{voiceOn=!voiceOn;$('voice').classList.toggle('on',voiceOn);localStorage.setItem('anubis_voice',voiceOn?'1':'0');};
$('clr').onclick=()=>{hist=[];localStorage.removeItem('anubis_hist');renderHist();};
$('expm').onclick=()=>{const md=hist.map(m=>(m.role==='user'?'**Arquitecto:** ':'**Anubis:** ')+m.text).join('\n\n');dl('anubis.md',md,'text/markdown');};
$('expj').onclick=()=>{dl('anubis.json',JSON.stringify(hist,null,2),'application/json');};
function dl(name,txt,type){const b=new Blob([txt],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();}
$('file').onchange=()=>{const f=$('file').files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{attached=rd.result;$('status').textContent='📎 '+f.name;};rd.readAsText(f);};
document.querySelectorAll('.tdot').forEach(d=>d.onclick=()=>{document.body.dataset.theme=d.dataset.theme;document.querySelectorAll('.tdot').forEach(x=>x.classList.remove('on'));d.classList.add('on');localStorage.setItem('anubis_theme',d.dataset.theme);});
const th=localStorage.getItem('anubis_theme');if(th){document.body.dataset.theme=th;document.querySelectorAll('.tdot').forEach(d=>d.classList.toggle('on',d.dataset.theme===th));}
hist=JSON.parse(localStorage.getItem('anubis_hist')||'[]');renderHist();
detect();setInterval(detect,15000);
</script></body></html>
