<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ANUBIS BLACK OMEGA · AVATAR</title>
<style>
:root{--bg:#050508;--acc:#FFD700;--acc2:#9D4EDD;--txt:#E5E5E5;--muted:#8a8a96;--glow:rgba(157,78,221,.6)}
[data-theme="sangre"]{--acc:#ff3b3b;--acc2:#ff6b6b;--glow:rgba(255,59,59,.6)}
[data-theme="vacío"]{--acc:#00e5ff;--acc2:#0088aa;--glow:rgba(0,229,255,.6)}
[data-theme="esmeralda"]{--acc:#2ee6a6;--acc2:#1aa87a;--glow:rgba(46,230,166,.6)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1a0d2e 0%,var(--bg) 60%);color:var(--txt);font-family:'Courier New',monospace;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
#avatar{width:min(70vw,320px);border-radius:18px;filter:drop-shadow(0 0 24px var(--glow));animation:breathe 4s ease-in-out infinite;transition:transform .1s;will-change:transform}
@keyframes breathe{0%,100%{transform:scale(1);filter:drop-shadow(0 0 18px var(--glow))}50%{transform:scale(1.03);filter:drop-shadow(0 0 36px var(--glow))}}
#eyes{position:absolute;width:100%;height:100%;pointer-events:none}
.particle{position:absolute;width:3px;height:3px;background:var(--acc);border-radius:50%;opacity:.8;animation:float 6s linear infinite}
@keyframes float{0%{transform:translateY(0) translateX(0);opacity:0}10%{opacity:.8}100%{transform:translateY(-120px) translateX(20px);opacity:0}}
#halo{position:absolute;width:min(80vw,360px);height:min(80vw,360px);border-radius:50%;border:2px solid var(--acc);opacity:.25;animation:spin 20s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#bar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--glow);background:rgba(12,10,20,.7)}
#status{flex:1;font-size:12px;color:var(--muted);text-align:center;min-height:16px}
.btn{background:none;border:1px solid var(--glow);color:var(--acc);border-radius:50%;width:44px;height:44px;font-size:18px;cursor:pointer}
.btn.on{background:var(--acc2);color:#fff}
#panel{position:fixed;top:0;right:-280px;width:280px;height:100vh;background:var(--bg);border-left:1px solid var(--glow);padding:16px;transition:right .25s;overflow-y:auto;z-index:10}
#panel.open{right:0}
#panel h3{font-size:11px;letter-spacing:2px;color:var(--acc);border-bottom:1px solid var(--glow);padding-bottom:4px}
#panel .row{display:flex;justify-content:space-between;align-items:center;margin:10px 0;font-size:13px}
input[type=range]{width:120px;accent-color:var(--acc)}
.themes{display:flex;gap:6px}.dot{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent}.dot.on{border-color:#fff}
</style></head>
<body>
<div id="stage">
  <div id="halo"></div>
  <img id="avatar" src="anubis.png" alt="ANUBIS">
  <div id="eyes"></div>
</div>
<div id="bar">
  <button class="btn" id="mic">🎤</button>
  <button class="btn" id="cfg">⚙</button>
  <div id="status">☥ Núcleos locales operando al 100%. Sin nube, sin cuotas.</div>
  <button class="btn on" id="voice">🔊</button>
</div>
<div id="panel">
  <h3>VOZ</h3>
  <div class="row"><label>Velocidad <b id="rv">1.0</b></label><input type="range" id="rate" min="0.5" max="2" step="0.1" value="1.0"></div>
  <div class="row"><label>Tono <b id="pv">1.0</b></label><input type="range" id="pitch" min="0.5" max="2" step="0.1" value="1.0"></div>
  <h3>SKINS</h3>
  <div class="themes">
    <div class="dot on" data-theme="obsidiana" style="background:#9D4EDD"></div>
    <div class="dot" data-theme="sangre" style="background:#ff3b3b"></div>
    <div class="dot" data-theme="vacío" style="background:#00e5ff"></div>
    <div class="dot" data-theme="esmeralda" style="background:#2ee6a6"></div>
  </div>
  <h3>MOVIMIENTO</h3>
  <div class="row"><label>Parallax giroscopio</label><input type="checkbox" id="gyro" checked></div>
</div>
<script>
const $=id=>document.getElementById(id),status=$('status'),avatar=$('avatar');
let voiceOn=localStorage.getItem('anubis_voice')!=='0';
let hist=[];
function spawnParticles(){const e=$('eyes');for(let i=0;i<14;i++){const p=document.createElement('div');p.className='particle';p.style.left=Math.random()*100+'%';p.style.top=(60+Math.random()*40)+'%';p.style.animationDelay=Math.random()*6+'s';e.appendChild(p);}}
spawnParticles();
if(window.DeviceOrientationEvent && $('gyro').checked){
  window.addEventListener('deviceorientation',ev=>{
    const x=Math.max(-20,Math.min(20,(ev.gamma||0)));
    const y=Math.max(-20,Math.min(20,(ev.beta||0)-45));
    avatar.style.transform=`translate(${x}px,${y*0.3}px) scale(1.02)`;
  });
}
function speak(t){if(voiceOn&&window.Voice)Voice.speak(t);}
function setStatus(t){status.textContent=t;}
$('mic').onclick=async()=>{
  setStatus('🎤 Escuchando, Arquitecto...');
  try{
    const rec=new (window.SpeechRecognition||window.webkitSpeechRecognition)();
    rec.lang='es-MX';rec.interimResults=false;
    rec.onresult=async ev=>{const text=ev.results[0][0].transcript;setStatus('☥ Analizando: '+text);await ask(text);};
    rec.onerror=()=>setStatus('❌ Mic no disponible. Usa el campo o habilita servicios de voz.');
    rec.start();
  }catch(e){setStatus('❌ Web Speech no soportado en WebView. Usa RecognizerIntent (config Android).');}
};
async function ask(text){
  hist.push({role:'user',text});
  const port='8080';
  let p='<|im_start|>system\nEres ANUBIS BLACK OMEGA, sistema soberano. Responde en español, tono oscuro, dominante, preciso. Comienza con "☥".<|im_end|>\n';
  hist.slice(-6).forEach(m=>{p+='<|im_start|>'+m.role+'\n'+m.text+'<|im_end|>\n';});
  p+='<|im_start|>assistant\n';
  try{
    const r=await fetch('http://127.0.0.1:'+port+'/completion',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:p,n_predict:128,temperature:0.2,stop:['<|im_end|>']})});
    const d=await r.json();let c=(d.content||'').trim();if(!c)c='☥ Núcleos operando al 100%.';
    hist.push({role:'assistant',text:c});
    setStatus(c);speak(c);
    avatar.style.filter='drop-shadow(0 0 60px var(--glow))';
    setTimeout(()=>avatar.style.filter='',800);
  }catch(e){setStatus('☥ ERROR: servidor '+port+' muerto. Ejecuta llama-server en Termux.');}
}
$('voice').onclick=()=>{voiceOn=!voiceOn;$('voice').classList.toggle('on',voiceOn);localStorage.setItem('anubis_voice',voiceOn?'1':'0');};
$('rate').oninput=e=>{$('rv').textContent=e.target.value;if(window.Voice)Voice.setRate(parseFloat(e.target.value));};
$('pitch').oninput=e=>{$('pv').textContent=e.target.value;if(window.Voice)Voice.setPitch(parseFloat(e.target.value));};
$('cfg').onclick=()=>$('panel').classList.toggle('open');
document.querySelectorAll('.dot').forEach(d=>d.onclick=()=>{document.body.dataset.theme=d.dataset.theme;document.querySelectorAll('.dot').forEach(x=>x.classList.remove('on'));d.classList.add('on');localStorage.setItem('anubis_theme',d.dataset.theme);});
const th=localStorage.getItem('anubis_theme');if(th){document.body.dataset.theme=th;document.querySelectorAll('.dot').forEach(d=>d.classList.toggle('on',d.dataset.theme===th));}
</script>
</body></html>
