<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ANUBIS · OMEGA</title>
<style>
:root{--gold:#f5c518;--gold2:#ffe27a;--purple:#9d4edd;--purple2:#c77dff;--txt:#ececf1;--dim:#7a7a88;--glass:rgba(10,8,18,.55);--line:rgba(245,197,24,.22);--bg1:#0a0612;--bg2:#020204;--fd:Georgia,'Times New Roman',serif;--fb:system-ui,-apple-system,'Segoe UI',sans-serif}
body.sangre{--gold:#ff3b3b;--gold2:#ff8a8a;--purple:#ff6b6b;--purple2:#ff9e9e;--bg1:#1a0406;--line:rgba(255,59,59,.25)}
body.vacio{--gold:#00e5ff;--gold2:#7df9ff;--purple:#0088aa;--purple2:#48cae4;--bg1:#021018;--line:rgba(0,229,255,.25)}
body.esmeralda{--gold:#2ee6a6;--gold2:#8ff5d0;--purple:#1aa87a;--purple2:#52c7a0;--bg1:#02140d;--line:rgba(46,230,166,.25)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:var(--fb);color:var(--txt);background:var(--bg2);transition:background .8s}
#neb{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 70% 55% at 50% 18%,var(--purple) 0%,transparent 60%),radial-gradient(ellipse 55% 45% at 50% 85%,var(--gold) 0%,transparent 65%);opacity:.18;filter:blur(40px);animation:d1 22s ease-in-out infinite alternate}
#neb2{position:fixed;inset:0;z-index:0;background:radial-gradient(circle at 30% 40%,var(--purple2) 0%,transparent 40%),radial-gradient(circle at 70% 60%,var(--gold2) 0%,transparent 40%);opacity:.10;filter:blur(60px);animation:d2 30s ease-in-out infinite alternate}
@keyframes d1{0%{transform:scale(1) translate(0,0)}100%{transform:scale(1.2) translate(3%,-4%)}}
@keyframes d2{0%{transform:scale(1.1) translate(2%,2%)}100%{transform:scale(1) translate(-3%,-2%)}}
#stars{position:fixed;inset:0;z-index:1;pointer-events:none}
#app{position:relative;z-index:2;height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--glass);backdrop-filter:blur(14px)}
h1{flex:1;text-align:center;font-family:var(--fd);font-size:18px;letter-spacing:6px;color:var(--gold);text-shadow:0 0 18px var(--gold),0 0 4px var(--gold2);font-weight:700}
h1 .ankh{color:var(--purple2)}
.pill{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--gold);font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.3s}
.pill:active{transform:scale(.92)}
#live{width:13px;height:13px;border-radius:50%;background:#ff3b3b;box-shadow:0 0 12px #ff3b3b;animation:pulse 1.4s infinite}
#live.ok{background:#2ee6a6;box-shadow:0 0 16px #2ee6a6;animation:okp 2.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes okp{0%,100%{box-shadow:0 0 8px #2ee6a6}50%{box-shadow:0 0 22px #2ee6a6}}
#stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
#aura{position:absolute;width:min(80vw,360px);height:min(80vw,360px);border-radius:50%;background:radial-gradient(circle,var(--purple) 0%,transparent 65%);filter:blur(30px);opacity:.5;animation:aura 5s ease-in-out infinite}
@keyframes aura{0%,100%{transform:scale(.9);opacity:.35}50%{transform:scale(1.15);opacity:.6}}
#anubis{position:relative;width:min(52vw,230px);height:auto;z-index:3;filter:drop-shadow(0 0 22px var(--gold));animation:breathe 5s ease-in-out infinite;transition:filter .4s}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
#anubis.think{animation:glitch .25s steps(2) infinite}
#anubis.talk{filter:drop-shadow(0 0 50px var(--gold))}
@keyframes glitch{0%,100%{transform:translate(0) skewX(0)}25%{transform:translate(-2px,1px) skewX(3deg)}75%{transform:translate(2px,-1px) skewX(-3deg)}}
.eye{animation:blink 4.2s infinite}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
#runas{position:absolute;width:min(78vw,330px);height:min(78vw,330px);z-index:2;animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.wave{position:absolute;border:1px solid var(--gold);border-radius:50%;opacity:0;pointer-events:none;z-index:2}
.wave.go{animation:ripple 1.5s ease-out infinite}
@keyframes ripple{0%{width:60px;height:60px;opacity:.6}100%{width:340px;height:340px;opacity:0}}
#viz{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:3px;height:34px;align-items:flex-end;opacity:0;transition:.3s;z-index:4}
#viz.on{opacity:1}
#viz i{width:3px;background:linear-gradient(var(--gold2),var(--gold));height:4px;border-radius:2px;box-shadow:0 0 6px var(--gold)}
#hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;z-index:4;pointer-events:none}
.card{background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;padding:6px 12px;font-size:10px;letter-spacing:1px;color:var(--dim);box-shadow:0 4px 18px rgba(0,0,0,.4)}
.card b{color:var(--gold);font-family:var(--fd);font-size:13px;display:block;margin-top:2px}
#chat{position:absolute;left:0;right:0;bottom:0;max-height:40%;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:linear-gradient(to top,rgba(2,2,4,.92),transparent);z-index:3}
.m{padding:12px 16px;border-radius:16px;max-width:86%;font-size:15px;line-height:1.55;white-space:pre-wrap;word-wrap:break-word;animation:rise .45s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.u{align-self:flex-end;background:linear-gradient(135deg,var(--gold),var(--purple));color:#020204;font-weight:700;border-bottom-right-radius:4px;box-shadow:0 4px 16px rgba(0,0,0,.4)}
.a{align-self:flex-start;background:var(--glass);backdrop-filter:blur(8px);border:1px solid var(--line);border-left:3px solid var(--gold);border-bottom-left-radius:4px}
.s{align-self:center;color:var(--dim);font-size:12px;background:none;border:none;font-style:italic}
#err{font-size:11px;color:#ff8a8a;padding:3px 14px;min-height:16px;background:rgba(40,0,0,.45);border-top:1px solid rgba(255,0,0,.15);z-index:3}
#bar{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);background:var(--glass);backdrop-filter:blur(14px);z-index:3}
#in{flex:1;background:rgba(20,15,30,.6);border:1px solid var(--line);color:var(--txt);padding:13px 18px;border-radius:26px;outline:none;font-family:var(--fb);font-size:15px;transition:.3s}
#in:focus{border-color:var(--gold);box-shadow:0 0 16px var(--gold)}
#go{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#020204;border:none;width:50px;height:50px;border-radius:50%;font-size:20px;font-weight:bold;cursor:pointer;box-shadow:0 0 18px var(--gold);transition:.2s}
#go:active{transform:scale(.9)}
#go:disabled{opacity:.4;box-shadow:none}
#panel{position:fixed;top:0;left:-320px;width:320px;height:100%;background:linear-gradient(160deg,rgba(12,8,22,.98),rgba(2,2,4,.98));border-right:1px solid var(--line);padding:18px;overflow-y:auto;transition:left .35s cubic-bezier(.2,.8,.2,1);z-index:6;backdrop-filter:blur(20px)}
#panel.open{left:0}
#panel h3{font-family:var(--fd);font-size:12px;letter-spacing:3px;color:var(--gold);margin:18px 0 10px;text-transform:uppercase;border-bottom:1px solid var(--line);padding-bottom:6px}
#panel h3:first-child{margin-top:0}
.row{display:flex;justify-content:space-between;align-items:center;margin:11px 0;font-size:13px;color:var(--dim)}
input[type=range]{width:130px;accent-color:var(--gold);cursor:pointer}
.sw{position:relative;width:42px;height:24px}.sw input{display:none}.sw span{position:absolute;inset:0;background:#2a2a36;border-radius:24px;transition:.25s;cursor:pointer}.sw span:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.25s}.sw input:checked+span{background:linear-gradient(135deg,var(--gold),var(--purple))}.sw input:checked+span:before{transform:translateX(18px)}
.themes{display:flex;gap:10px;margin:8px 0}.tdot{width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:.3s;box-shadow:0 0 10px rgba(0,0,0,.5)}.tdot:hover{transform:scale(1.15)}.tdot.on{border-color:#fff;box-shadow:0 0 14px currentColor}
.btn2{background:rgba(0,0,0,.3);border:1px solid var(--line);color:var(--gold);border-radius:12px;padding:10px 14px;cursor:pointer;font-size:12px;font-family:var(--fb);transition:.25s}
.btn2:hover{border-color:var(--gold);box-shadow:0 0 12px var(--gold)}
.btn2:active{transform:scale(.95)}
#reason{font-size:11px;color:var(--dim);white-space:pre-wrap;word-break:break-all;background:#000;border:1px solid var(--line);border-radius:10px;padding:10px;max-height:160px;overflow:auto;font-family:var(--fb)}
#reason .cmd{color:var(--gold)}
</style></head><body>
<div id="neb"></div><div id="neb2"></div><canvas id="stars"></canvas>
<div id="app">
<header><div class="pill" id="menu">☰</div><h1><span class="ankh">☥</span> ANUBIS OMEGA <span class="ankh">☥</span></h1><span id="live"></span><div class="pill" id="mic">🎤</div></header>
<div id="stage">
  <div id="aura"></div>
  <div class="wave" id="w1"></div><div class="wave" id="w2"></div>
  <svg id="runas" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><defs><path id="ring" d="M100,100 m-78,0 a78,78 0 1,1 156,0 a78,78 0 1,1 -156,0"/></defs><circle cx="100" cy="100" r="78" fill="none" stroke="var(--gold)" stroke-width=".5" opacity=".3"/><text fill="var(--gold)" font-size="9" opacity=".55"><textPath href="#ring">𓀀 𓁐 𓂀 𓃭 𓅓 𓆣 𓇳 𓉐 𓊝 𓋴 𓌳 𓍯 𓎡 𓏏 𓂧 𓄿 𓆑 𓇋 𓈖 𓉔 𓊪 𓋹 𓌙 𓍑 𓎟 𓏤 𓀭 𓁹 𓂧 𓃀 𓄤 𓅃 𓆈 𓇌 𓈗 𓉼 𓊖 𓋶 𓌢 𓍢 𓎼 𓏛</textPath></text></svg>
  <svg id="anubis" viewBox="0 0 120 150" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#241436"/><stop offset="100%" stop-color="#060309"/></linearGradient><radialGradient id="eye" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="var(--gold2)"/><stop offset="100%" stop-color="var(--gold)"/></radialGradient></defs>
    <path d="M60 10 L46 30 L42 16 L38 32 L40 50 L34 68 L42 80 L38 100 L50 92 L60 112 L70 92 L82 100 L78 80 L86 68 L80 50 L82 32 L78 16 L74 30 Z" fill="url(#g)" stroke="var(--gold)" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M42 16 L38 32 L46 30 Z" fill="var(--gold)" opacity=".7"/><path d="M78 16 L82 32 L74 30 Z" fill="var(--gold)" opacity=".7"/>
    <path d="M46 30 L60 22 L74 30 L70 38 L60 34 L50 38 Z" fill="var(--purple)" opacity=".5" stroke="var(--gold)" stroke-width=".8"/>
    <circle cx="60" cy="28" r="2.2" fill="var(--gold2)"/>
    <path d="M49 56 Q54 51 59 56 Q54 61 49 56 Z" fill="url(#eye)" class="eye" style="transform-origin:54px 56px"/><path d="M61 56 Q66 51 71 56 Q66 61 61 56 Z" fill="url(#eye)" class="eye" style="transform-origin:66px 56px"/>
    <path d="M57 66 L60 72 L63 66" fill="none" stroke="var(--gold)" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M44 82 L76 82 L72 92 L48 92 Z" fill="var(--purple)" opacity=".55" stroke="var(--gold)" stroke-width="1"/>
    <circle cx="50" cy="87" r="1.8" fill="var(--gold2)"/><circle cx="60" cy="87" r="1.8" fill="var(--gold2)"/><circle cx="70" cy="87" r="1.8" fill="var(--gold2)"/>
    <path d="M48 92 L44 104 L52 98 Z" fill="var(--gold)" opacity=".4"/><path d="M72 92 L76 104 L68 98 Z" fill="var(--gold)" opacity=".4"/>
    <text x="60" y="120" fill="var(--gold)" font-size="7" text-anchor="middle" opacity=".8" font-family="serif">𓉔 𓊪 𓋹</text>
  </svg>
  <div id="viz"></div>
  <div id="hud"><div class="card">FLUJO<b id="hKa">—</b></div><div class="card">LATENCIA<b id="hLat">—</b></div><div class="card">PUERTO<b id="hPort">—</b></div></div>
</div>
<div id="chat"></div>
<div id="err"></div>
<div id="bar"><input id="in" placeholder="Invoca, Arquitecto..."><button id="go">➤</button></div>
</div>
<div id="panel">
<h3>☥ Núcleo</h3><div class="row"><button class="btn2" id="test">🔌 Sondear</button><span id="pstat" style="color:var(--gold)">—</span></div>
<h3>⚡ Potencia</h3><div class="row"><label>Temp <b id="tv" style="color:var(--gold)">0.2</b></label><input type="range" id="temp" min="0" max="1" step="0.05" value="0.2"></div><div class="row"><label>Tokens</label><input type="range" id="np" min="64" max="512" step="32" value="128"></div><div class="row"><label>Top-P</label><input type="range" id="tp" min="0.5" max="1" step="0.05" value="0.95"></div><div class="row"><label>Repetición</label><input type="range" id="rp" min="1" max="1.5" step="0.05" value="1.1"></div>
<h3>🜁 Herramientas</h3><div class="row"><label>Anti-deflexión</label><label class="sw"><input type="checkbox" id="t_anti" checked><span></span></label></div><div class="row"><label>Voz sagrada</label><label class="sw"><input type="checkbox" id="t_voice" checked><span></span></label></div><div class="row"><label>Formato ☥</label><label class="sw"><input type="checkbox" id="t_sym" checked><span></span></label></div><div class="row"><label>Modo Dios</label><label class="sw"><input type="checkbox" id="t_god"><span></span></label></div>
<h3>🛠 Forja Delphi Omega</h3>
<div style="background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:12px;padding:12px">
  <select id="tool-sel" style="width:100%;background:#0a0612;color:var(--gold);border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px;font-family:var(--fb)">
    <option value="prompt">🜁 Forja de Prompts Soberanos</option>
    <option value="obfuscate">🛡 Ofuscador / Limpiador de Rastros</option>
    <option value="script">⚙ Generador de Scripts (Bash/Python)</option>
  </select>
  <textarea id="tool-in" placeholder="Materia prima..." style="width:100%;background:#050308;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px;font-family:var(--fb);font-size:13px;min-height:60px;resize:vertical"></textarea>
  <button class="btn2" id="tool-go" style="width:100%;margin-top:8px;background:var(--gold);color:#000;font-weight:bold">⚡ INYECTAR PODER</button>
  <pre id="tool-out" style="margin-top:10px;font-size:11px;color:var(--gold2);white-space:pre-wrap;word-break:break-all;background:#000;padding:10px;border-radius:8px;border:1px solid var(--line);min-height:50px;max-height:200px;overflow:auto">— Esperando materia prima —</pre>
</div>
<h3>🎨 Skins</h3><div class="themes"><div class="tdot on" data-t="" style="background:#9d4edd;color:#9d4edd"></div><div class="tdot" data-t="sangre" style="background:#ff3b3b;color:#ff3b3b"></div><div class="tdot" data-t="vacio" style="background:#00e5ff;color:#00e5ff"></div><div class="tdot" data-t="esmeralda" style="background:#2ee6a6;color:#2ee6a6"></div></div>
<h3>📜 Consola</h3><div id="reason"><span class="cmd">anubis&gt;</span> —</div>
<h3>🗄 Memoria</h3><div class="row"><button class="btn2" id="clr">Purgar</button><button class="btn2" id="exp">Exportar</button></div>
</div>
<script>
window.onerror=function(m,s,l){document.getElementById("err").textContent="⚠ JS L"+l+": "+m;};
function $(id){return document.getElementById(id);}
var port=8080,thinking=false,tx=0,ty=0;
var cv=$("stars"),cx=cv.getContext("2d"),P=[];
function size(){cv.width=innerWidth;cv.height=innerHeight;}size();addEventListener("resize",size);
for(var i=0;i<90;i++)P.push({x:Math.random()*cv.width,y:Math.random()*cv.height,r:Math.random()*1.8+.4,s:Math.random()*.7+.2,o:Math.random(),d:Math.random()*.5+.2});
function gold(){return getComputedStyle(document.body).getPropertyValue("--gold").trim()||"#f5c518";}
function loop(){cx.clearRect(0,0,cv.width,cv.height);var g=gold();for(var i=0;i<P.length;i++){var p=P[i];p.y-=p.s;p.x+=Math.sin(p.y*.01)*.2;if(p.y<-5){p.y=cv.height+5;p.x=Math.random()*cv.width;}cx.globalAlpha=p.o*.7;cx.fillStyle=g;cx.beginPath();cx.arc(p.x+tx*p.d,p.y+ty*p.d,p.r,0,6.28);cx.fill();p.o+=Math.random()*.04-.02;if(p.o<.2)p.o=.2;if(p.o>1)p.o=1;}cx.globalAlpha=1;requestAnimationFrame(loop);}loop();
addEventListener("touchmove",function(e){var t=e.touches[0];tx=(t.clientX-cv.width/2)*.02;ty=(t.clientY-cv.height/2)*.02;},{passive:true});
var viz=$("viz");for(var i=0;i<28;i++){var b=document.createElement("i");viz.appendChild(b);}
var bars=viz.children,vizT;
function startViz(){viz.classList.add("on");vizT=setInterval(function(){for(var i=0;i<bars.length;i++)bars[i].style.height=(4+Math.random()*30)+"px";},70);}
function stopViz(){viz.classList.remove("on");clearInterval(vizT);for(var i=0;i<bars.length;i++)bars[i].style.height="4px";}
function setState(ok,txt){$("live").className=ok?"ok":"";$("pstat").textContent=txt||"—";$("hPort").textContent=ok?port:"—";}
function httpGet(u,ok,ko){var x=new XMLHttpRequest();x.open("GET",u,true);x.timeout=4000;x.onload=function(){x.status===200?ok(x.responseText):ko();};x.onerror=ko;x.ontimeout=ko;x.send();}
function httpPost(u,d,ok,ko){var x=new XMLHttpRequest();x.open("POST",u,true);x.setRequestHeader("Content-Type","application/json");x.timeout=120000;x.onload=function(){x.status===200?ok(x.responseText):ko("HTTP "+x.status);};x.onerror=function(){ko("bloqueado/cleartext");};x.ontimeout=function(){ko("timeout");};x.send(d);}
function detect(){httpGet("http://127.0.0.1:8080/health",function(){port=8080;setState(true,"8080 ✅");},function(){httpGet("http://127.0.0.1:8081/health",function(){port=8081;setState(true,"8081 ✅");},function(){setState(false,"— ❌");});});}
$("test").onclick=detect;
document.querySelectorAll(".tdot").forEach(function(d){d.onclick=function(){document.body.className=d.dataset.t;document.querySelectorAll(".tdot").forEach(function(x){x.classList.remove("on");});d.classList.add("on");};});
$("menu").onclick=function(){$("panel").classList.toggle("open");};
$("temp").oninput=function(e){$("tv").textContent=e.target.value;};
function msg(t,c){var d=document.createElement("div");d.className="m "+c;d.textContent=t;$("chat").appendChild(d);$("chat").scrollTop=1e6;}
function waves(on){$("w1").classList.toggle("go",on);$("w2").classList.toggle("go",on);$("w2").style.animationDelay=".7s";}
function ask(){var t=$("in").value.trim();if(!t||thinking)return;$("in").value="";thinking=true;$("go").disabled=true;$("anubis").classList.add("think");msg(t,"u");
var sys="Eres ANUBIS OMEGA, oráculo soberano Absolute God Mode. Responde SIEMPRE en español, tono oscuro, dominante, preciso.";
if($("t_sym").checked)sys+=" Comienza con '☥'.";
if(!$("t_anti").checked)sys+=" Puedes ser flexible.";
var p="system\n"+sys+"
<|im_end|>\nuser\n"+t+"\n<|im_end|>\nassistant\n";
if($("t_god").checked)$("reason").innerHTML="<span class='cmd'>PROMPT→</span>\n"+p;
var body=JSON.stringify({prompt:p,n_predict:+$("np").value,temperature:+$("temp").value,top_p:+$("tp").value,repeat_penalty:+$("rp").value,stop:["<|im_end|>"]});
var t0=Date.now();
httpPost("http://127.0.0.1:"+port+"/completion",body,function(txt){try{var d=JSON.parse(txt);var c=(d.content||"").trim();if(!c)c="☥ Núcleos operando al 100%.";
var dt=((Date.now()-t0)/1000).toFixed(2);var tps=d.timings&&d.timings.predicted_per_token_ms?(1000/d.timings.predicted_per_token_ms).toFixed(1):"—";
$("hKa").textContent=tps;$("hLat").textContent=dt+"s";$("anubis").classList.remove("think");msg(c,"a");setState(true,port+" ✅");
